name: Publish to npm

# Trusted-publisher release flow.
#   1. Tag a release commit:   git tag v0.2.1  &&  git push --tags
#   2. This workflow runs on the tag push, verifies the build, and publishes
#      via OIDC (no NPM_TOKEN secret needed once the Trusted Publisher is
#      configured on npmjs.com).
#   3. npm automatically attaches a provenance attestation to the tarball
#      (verified badge on the package page).
#
# Manual trigger is also enabled for cases where you need to retry without
# moving a tag — useful when configuring the trusted publisher for the
# first time.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token used by trusted publishing.
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI >= 11.5.1. Node 24 LTS ships
      # with a recent npm, but we upgrade explicitly so future Node bumps
      # don't silently regress this.
      - name: Upgrade npm to latest
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # A version published by hand (or by an earlier run) can't be published
      # again; skip the upload rather than fail the release.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; the publish step will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
